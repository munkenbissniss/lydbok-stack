# Uten VPN: qBittorrent kobler seg direkte til nettet (ikke anbefalt).
# Velges av veiviseren hvis du svarer «ingen VPN».
services:
  gluetun:
    profiles: ["disabled"]
  qbittorrent:
    network_mode: !reset null
    depends_on: !override
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8090:8080
      - 6891:6891
      - 6891:6891/udp
