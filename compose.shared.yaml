# Bruker nedlasterne fra Plex-stack på samme maskin (VPN, qBittorrent, NZBGet, Prowlarr).
# Bookshelf, autoconfig og dashboardet kobles på Plex-stackens nettverk, så de når
# appene der med navn (prowlarr, gluetun, nzbget), og Prowlarr når Bookshelf.
# Velges av veiviseren når den finner Plex-stack. Plex-stack må kjøre først.
networks:
  plex:
    external: true
    name: ${SHARED_NETWORK:-plex-stack_default}

services:
  bookshelf:  {networks: [default, plex]}
  autoconfig: {networks: [default, plex]}
  homepage:   {networks: [default, plex]}
