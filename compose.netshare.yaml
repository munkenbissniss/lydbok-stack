# Mediemappa ligger på en nettverksdeling (NFS eller SMB/Windows-deling).
# Docker kobler seg til delingen selv – ingenting må monteres på maskinen.
# Velges av veiviseren. Endrer du delingen: «docker compose down», kjør
# veiviseren igjen (den fjerner den gamle koblingen), og «docker compose up -d».
volumes:
  media:
    driver: local
    driver_opts:
      type: ${SHARE_TYPE:-nfs}
      o: ${SHARE_OPTS:-}
      device: ${SHARE_DEVICE:-}

services:
  init:           {volumes: [media:/data]}
  autoconfig:     {volumes: [media:/data:ro]}
  audiobookshelf: {volumes: [media:/data]}
  bookshelf:      {volumes: [media:/data]}
  qbittorrent:    {volumes: [media:/data]}
  nzbget:         {volumes: [media:/data]}
  homepage:       {volumes: [media:/mediadisk:ro]}
